<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>People · Command Center</title>
  <link rel="stylesheet" href="../assets/css/tools.css" />
  <script src="../assets/js/tools.js"></script>
  <style>
    .crm { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
    @media (max-width: 820px) { .crm { grid-template-columns: 1fr; } }
    .plist { display: flex; flex-direction: column; gap: 4px; max-height: 70vh; overflow-y: auto; }
    .pitem { padding: 10px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
    .pitem:hover { background: var(--bg-sunk); }
    .pitem.active { background: var(--accent-soft); border-color: var(--accent); }
    .pitem .pn { font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .pitem .pr { font-size: .78rem; color: var(--text-faint); }
    .bar { height: 5px; border-radius: 3px; background: var(--bg-sunk); overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; }
    .chan { display: inline-flex; align-items: center; gap: 5px; margin: 3px 6px 3px 0; }
    .ix { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .ix:last-child { border-bottom: none; }
    .ix .ixd { width: 78px; flex: none; color: var(--text-faint); font-size: .78rem; }
    .ix .ixt { flex: 1; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-base="../">
  <div class="wrap">
    <div class="page-head">
      <h1>People</h1>
      <p>Your relationships, on purpose. Add connections and their channels, log every interaction, and keep in touch on a cadence. Overdue people surface as reach-out blocks on your Calendar.</p>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="row">
        <input type="text" id="n-name" placeholder="Name" style="flex:2 1 160px" />
        <input type="text" id="n-rel" placeholder="Relationship (e.g. grad school, work)" style="flex:2 1 180px" />
        <select id="n-cad" style="width:150px">
          <option value="0">No reminder</option>
          <option value="14">Every 2 weeks</option>
          <option value="30" selected>Monthly</option>
          <option value="90">Quarterly</option>
          <option value="180">Twice a year</option>
          <option value="365">Yearly</option>
        </select>
        <button class="btn primary" onclick="addPerson()">Add</button>
      </div>
    </div>

    <div class="crm">
      <div class="card">
        <input type="text" id="search" placeholder="Search people…" oninput="render()" style="margin-bottom:10px" />
        <div class="plist" id="plist"></div>
        <hr class="sep" />
        <div class="row between">
          <span class="muted" id="count" style="font-size:.8rem"></span>
          <button class="btn ghost sm" onclick="exportJSON()">Export</button>
        </div>
      </div>
      <div class="card" id="detail"></div>
    </div>
    <p class="footer-note">Stored locally in your browser. Use Export (or Backup &amp; Restore) to keep a copy.</p>
  </div>

  <script>
    CC.buildTopbar('contacts');
    var TYPES = ['Coffee', 'Meal', 'Call', 'Video', 'Email', 'Text', 'Event', 'Intro', 'Note', 'Other'];
    var TYPE_ICON = { Coffee: '☕', Meal: '🍽️', Call: '☎️', Video: '📹', Email: '✉️', Text: '💬', Event: '🎉', Intro: '🤝', Note: '📝', Other: '•' };
    var CHAN_TYPES = ['Email', 'Phone', 'LinkedIn', 'X', 'Instagram', 'Signal', 'WhatsApp', 'Website', 'Other'];
    var selId = null;

    function all() { return CC.load('cc.contacts', []); }
    function setAll(x) { CC.save('cc.contacts', x); }
    function get(id) { return all().find(function (c) { return c.id === id; }); }
    function update(id, fn) { var a = all(); var c = a.find(function (x) { return x.id === id; }); if (c) { fn(c); setAll(a); } }

    function addPerson() {
      var name = document.getElementById('n-name').value.trim();
      if (!name) { document.getElementById('n-name').focus(); return; }
      var a = all();
      var c = { id: CC.uid(), name: name, relationship: document.getElementById('n-rel').value.trim(),
        cadence: parseInt(document.getElementById('n-cad').value, 10) || 0, channels: [], interactions: [], created: CC.todayStr() };
      a.push(c); setAll(a);
      document.getElementById('n-name').value = ''; document.getElementById('n-rel').value = '';
      selId = c.id; render();
    }
    function del(id) { if (confirm('Delete this person and their history?')) { setAll(all().filter(function (c) { return c.id !== id; })); if (selId === id) selId = null; render(); } }
    function exportJSON() {
      var blob = new Blob([JSON.stringify(all(), null, 2)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'people.json'; a.click();
    }

    /* interactions */
    function logIx(id) {
      var date = document.getElementById('ix-date').value || CC.todayStr();
      var type = document.getElementById('ix-type').value;
      var note = document.getElementById('ix-note').value.trim();
      update(id, function (c) { c.interactions = c.interactions || []; c.interactions.push({ id: CC.uid(), date: date, type: type, note: note }); });
      render();
    }
    function quickTouch(id) {
      update(id, function (c) { c.interactions = c.interactions || []; c.interactions.push({ id: CC.uid(), date: CC.todayStr(), type: 'Note', note: 'Touched base' }); });
      render();
    }
    function delIx(id, ixid) { update(id, function (c) { c.interactions = (c.interactions || []).filter(function (i) { return i.id !== ixid; }); }); render(); }

    /* channels */
    function addChan(id) {
      var type = document.getElementById('ch-type').value;
      var val = document.getElementById('ch-val').value.trim();
      if (!val) return;
      update(id, function (c) { c.channels = c.channels || []; c.channels.push({ type: type, value: val }); });
      render();
    }
    function delChan(id, idx) { update(id, function (c) { c.channels.splice(idx, 1); }); render(); }
    function chanHref(ch) {
      var v = ch.value;
      if (ch.type === 'Email' || /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return 'mailto:' + v;
      if (/^https?:\/\//.test(v)) return v;
      if (ch.type === 'Phone' || /^[+()\d\s-]{7,}$/.test(v)) return 'tel:' + v.replace(/[^+\d]/g, '');
      if (ch.type === 'LinkedIn' && !/\s/.test(v)) return 'https://www.linkedin.com/in/' + v.replace(/^@/, '');
      if (ch.type === 'X' && !/\s/.test(v)) return 'https://x.com/' + v.replace(/^@/, '');
      if (ch.type === 'Instagram' && !/\s/.test(v)) return 'https://instagram.com/' + v.replace(/^@/, '');
      return null;
    }

    function setField(id, field, val) { update(id, function (c) { c[field] = field === 'cadence' ? (parseInt(val, 10) || 0) : val; }); if (field === 'cadence') render(); }

    function render() {
      var due = CC.contactsDue();
      var q = (document.getElementById('search').value || '').toLowerCase();
      var shown = due.filter(function (d) {
        if (!q) return true;
        var c = d.c;
        return (c.name + ' ' + (c.relationship || '') + ' ' + (c.channels || []).map(function (x) { return x.value; }).join(' ')).toLowerCase().indexOf(q) >= 0;
      });

      var host = document.getElementById('plist');
      if (!due.length) { host.innerHTML = '<div class="muted" style="font-size:.85rem;padding:6px">No people yet. Add someone above.</div>'; }
      else {
        host.innerHTML = shown.map(function (d) {
          var c = d.c;
          var pill = !c.cadence ? '' : d.overdue ? '<span class="pill danger">due</span>'
            : '<span class="pill good">' + (c.cadence - d.since) + 'd</span>';
          return '<div class="pitem ' + (c.id === selId ? 'active' : '') + '" onclick="selById(\'' + c.id + '\')">' +
            '<div class="pn">' + CC.esc(c.name) + pill + '</div>' +
            '<div class="pr">' + CC.esc(c.relationship || '') + (d.last ? ' · ' + d.since + 'd ago' : ' · no contact logged') + '</div></div>';
        }).join('');
      }
      document.getElementById('count').textContent = due.length + ' people · ' + due.filter(function (d) { return d.overdue; }).length + ' due';

      renderDetail();
    }

    function renderDetail() {
      var host = document.getElementById('detail');
      if (!selId || !get(selId)) {
        host.innerHTML = '<div class="empty">Select a person, or add one above.<br><span class="muted">Tip: log a coffee or call and set a cadence, and they\'ll pop up on your Calendar when it\'s time to reconnect.</span></div>';
        return;
      }
      var c = get(selId);
      var due = CC.contactsDue().find(function (d) { return d.c.id === c.id; });
      var last = CC.contactLastDate(c);
      var statusHtml;
      if (!c.cadence) statusHtml = '<span class="pill">no reminder</span>';
      else if (!last) statusHtml = '<span class="pill danger">never logged · reach out</span>';
      else if (due.overdue) statusHtml = '<span class="pill danger">' + (due.since - c.cadence) + 'd overdue</span>';
      else statusHtml = '<span class="pill good">next in ' + (c.cadence - due.since) + 'd</span>';
      var pct = due && c.cadence ? Math.min(100, Math.round(due.frac * 100)) : 0;
      var barColor = !due || !c.cadence ? 'var(--border-strong)' : due.frac >= 1 ? 'var(--danger)' : due.frac >= .75 ? 'var(--warn)' : 'var(--good)';

      var chans = (c.channels || []).map(function (ch, i) {
        var href = chanHref(ch);
        var label = CC.esc(ch.type) + ': ' + (href ? '<a href="' + CC.esc(href) + '" target="_blank" rel="noopener">' + CC.esc(ch.value) + '</a>' : CC.esc(ch.value));
        return '<span class="chan pill">' + label + ' <span style="cursor:pointer;color:var(--text-faint)" onclick="delChan(\'' + c.id + '\',' + i + ')">×</span></span>';
      }).join('') || '<span class="muted" style="font-size:.84rem">No channels yet.</span>';

      var ixs = (c.interactions || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (i) {
        return '<div class="ix"><div class="ixd">' + fmtDate(i.date) + '</div>' +
          '<div class="ixt"><span class="pill">' + (TYPE_ICON[i.type] || '•') + ' ' + CC.esc(i.type) + '</span> ' + CC.esc(i.note || '') + '</div>' +
          '<button class="btn ghost sm" onclick="delIx(\'' + c.id + '\',\'' + i.id + '\')">×</button></div>';
      }).join('') || '<div class="muted" style="font-size:.84rem">No interactions logged yet.</div>';

      var chTypeOpts = CHAN_TYPES.map(function (t) { return '<option>' + t + '</option>'; }).join('');
      var ixTypeOpts = TYPES.map(function (t) { return '<option>' + t + '</option>'; }).join('');

      host.innerHTML =
        '<div class="row between"><input type="text" value="' + CC.esc(c.name) + '" onchange="setField(\'' + c.id + '\',\'name\',this.value)" style="font-weight:700;font-size:1.2rem;border:none;background:transparent;flex:1" />' +
          '<button class="btn danger sm" onclick="del(\'' + c.id + '\')">Delete</button></div>' +
        '<div class="field-row" style="margin-top:8px">' +
          '<div><label class="fld">Relationship</label><input type="text" value="' + CC.esc(c.relationship || '') + '" onchange="setField(\'' + c.id + '\',\'relationship\',this.value)" /></div>' +
          '<div><label class="fld">Keep in touch</label><select onchange="setField(\'' + c.id + '\',\'cadence\',this.value)">' +
            [['0', 'No reminder'], ['14', 'Every 2 weeks'], ['30', 'Monthly'], ['90', 'Quarterly'], ['180', 'Twice a year'], ['365', 'Yearly']]
              .map(function (o) { return '<option value="' + o[0] + '" ' + (String(c.cadence) === o[0] ? 'selected' : '') + '>' + o[1] + '</option>'; }).join('') +
          '</select></div></div>' +
        '<div class="row" style="margin-top:12px">' + statusHtml + '<span class="muted" style="font-size:.82rem">' + (last ? 'last contact ' + fmtDate(last) : '') + '</span>' +
          '<span class="spacer" style="flex:1"></span><button class="btn sm" onclick="quickTouch(\'' + c.id + '\')">✓ Touched base today</button></div>' +
        '<div class="bar"><i style="width:' + pct + '%;background:' + barColor + '"></i></div>' +

        '<h2 class="section">Channels &amp; digital</h2>' +
        '<div>' + chans + '</div>' +
        '<div class="row" style="margin-top:8px"><select id="ch-type" style="width:130px">' + chTypeOpts + '</select>' +
          '<input type="text" id="ch-val" placeholder="email, @handle, or URL" style="flex:1" />' +
          '<button class="btn sm" onclick="addChan(\'' + c.id + '\')">Add</button></div>' +

        '<h2 class="section">Log an interaction</h2>' +
        '<div class="row"><input type="date" id="ix-date" value="' + CC.todayStr() + '" style="width:150px" />' +
          '<select id="ix-type" style="width:120px">' + ixTypeOpts + '</select>' +
          '<input type="text" id="ix-note" placeholder="What did you talk about?" style="flex:1" onkeydown="if(event.key===\'Enter\')logIx(\'' + c.id + '\')" />' +
          '<button class="btn primary sm" onclick="logIx(\'' + c.id + '\')">Log</button></div>' +
        '<div style="margin-top:12px">' + ixs + '</div>';
    }

    function selById(id) { selId = id; render(); }
    function fmtDate(s) { var d = new Date(s + 'T00:00:00'); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }

    render();
  </script>
</body>
</html>
