<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scratchpad · Command Center</title>
  <link rel="stylesheet" href="../assets/css/tools.css" />
  <script src="../assets/js/tools.js"></script>
  <style>
    .np-layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; }
    @media (max-width: 820px) { .np-layout { grid-template-columns: 1fr; } }
    .note-list { display: flex; flex-direction: column; gap: 4px; }
    .note-item { padding: 9px 11px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
    .note-item:hover { background: var(--bg-sunk); }
    .note-item.active { background: var(--accent-soft); border-color: var(--accent); }
    .note-item .t { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-item .d { font-size: .72rem; color: var(--text-faint); }
    .editor-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 60vh; }
    @media (max-width: 820px) { .editor-wrap { grid-template-columns: 1fr; } .preview { display: none; } }
    #editor { border: none; border-right: 1px solid var(--border); border-radius: 0; resize: none;
      font-family: var(--mono); font-size: .9rem; line-height: 1.65; padding: 16px; min-height: 60vh; }
    .preview { padding: 16px 20px; overflow-y: auto; max-height: 70vh; }
    .preview h1 { font-size: 1.5rem; margin: .4em 0 .3em; } .preview h2 { font-size: 1.2rem; margin:.6em 0 .3em; }
    .preview h3 { font-size: 1.05rem; } .preview code { background: var(--bg-sunk); padding: 1px 5px; border-radius: 5px; font-family: var(--mono); font-size: .85em; }
    .preview pre { background: var(--bg-sunk); padding: 12px; border-radius: 9px; overflow-x: auto; }
    .preview blockquote { border-left: 3px solid var(--border-strong); margin: .6em 0; padding: 2px 14px; color: var(--text-soft); }
    .preview ul, .preview ol { padding-left: 22px; }
    .preview a { text-decoration: underline; }
    .save-ind { font-size: .76rem; color: var(--text-faint); }
  </style>
</head>
<body data-base="../">
  <div class="wrap">
    <div class="page-head">
      <h1>Scratchpad</h1>
      <p>Autosaving Markdown notes — meeting minutes, memo drafts, call prep. Split preview on the right.</p>
    </div>

    <div class="np-layout">
      <div class="card">
        <button class="btn primary sm" style="width:100%" onclick="newNote()">+ New note</button>
        <hr class="sep" />
        <div class="note-list" id="note-list"></div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div class="row between" style="padding:10px 14px;border-bottom:1px solid var(--border)">
          <input type="text" id="title" placeholder="Untitled note" style="border:none;background:transparent;font-weight:700;font-size:1.05rem" />
          <div class="row">
            <span class="save-ind" id="save-ind">Saved</span>
            <button class="btn ghost sm" onclick="downloadNote()" title="Download .md">↓ .md</button>
            <button class="btn danger sm" onclick="delNote()">Delete</button>
          </div>
        </div>
        <div class="editor-wrap">
          <textarea id="editor" placeholder="# Write in Markdown&#10;&#10;- lists&#10;- **bold**, *italic*, `code`&#10;&#10;> quotes"></textarea>
          <div class="preview" id="preview"></div>
        </div>
      </div>
    </div>
    <p class="footer-note">Notes live in your browser only. Use ↓ .md to export a copy.</p>
  </div>

  <script>
    CC.buildTopbar('notes');
    var KEY = 'cc.notes';
    var curId = null, saveTimer = null;

    function db() { return CC.load(KEY, []); }
    function setDb(x) { CC.save(KEY, x); }

    function newNote() {
      var notes = db();
      var n = { id: CC.uid(), title: '', body: '', updated: Date.now() };
      notes.unshift(n); setDb(notes); curId = n.id;
      renderList(); loadNote(); document.getElementById('title').focus();
    }
    function loadNote() {
      var n = db().find(function (x) { return x.id === curId; });
      if (!n) { var all = db(); if (all.length) { curId = all[0].id; n = all[0]; } }
      if (!n) { document.getElementById('title').value = ''; document.getElementById('editor').value = ''; renderPreview(); return; }
      document.getElementById('title').value = n.title;
      document.getElementById('editor').value = n.body;
      renderPreview(); renderList();
    }
    function selectNote(id) { curId = id; loadNote(); }
    function delNote() {
      if (!curId) return;
      if (!confirm('Delete this note?')) return;
      setDb(db().filter(function (x) { return x.id !== curId; }));
      curId = null; loadNote();
    }
    function persist() {
      var notes = db();
      var n = notes.find(function (x) { return x.id === curId; });
      if (!n) return;
      n.title = document.getElementById('title').value;
      n.body = document.getElementById('editor').value;
      n.updated = Date.now();
      // move to top
      notes = notes.filter(function (x) { return x.id !== curId; }); notes.unshift(n);
      setDb(notes); renderList();
      document.getElementById('save-ind').textContent = 'Saved';
    }
    function scheduleSave() {
      document.getElementById('save-ind').textContent = 'Saving…';
      clearTimeout(saveTimer); saveTimer = setTimeout(persist, 500);
      renderPreview();
    }
    function renderList() {
      var host = document.getElementById('note-list');
      var notes = db();
      if (!notes.length) { host.innerHTML = '<div class="muted" style="font-size:.82rem;padding:6px">No notes yet.</div>'; return; }
      host.innerHTML = notes.map(function (n) {
        var title = n.title.trim() || firstLine(n.body) || 'Untitled';
        var d = new Date(n.updated);
        return '<div class="note-item ' + (n.id === curId ? 'active' : '') + '" onclick="selectNote(\'' + n.id + '\')">' +
          '<div class="t">' + CC.esc(title) + '</div>' +
          '<div class="d">' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
          d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</div></div>';
      }).join('');
    }
    function firstLine(s) { return (s || '').split('\n')[0].replace(/^#+\s*/, '').slice(0, 40); }
    function downloadNote() {
      var n = db().find(function (x) { return x.id === curId; }); if (!n) return;
      var name = (n.title.trim() || 'note').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'note';
      var blob = new Blob([n.body], { type: 'text/markdown' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.md'; a.click();
    }

    /* --- minimal, safe Markdown renderer --- */
    function md(src) {
      var lines = String(src).split('\n');
      var out = [], i = 0;
      function inline(t) {
        t = CC.esc(t);
        t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
        t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        return t;
      }
      while (i < lines.length) {
        var l = lines[i];
        if (/^```/.test(l)) {
          var buf = []; i++;
          while (i < lines.length && !/^```/.test(lines[i])) { buf.push(CC.esc(lines[i])); i++; }
          i++; out.push('<pre><code>' + buf.join('\n') + '</code></pre>'); continue;
        }
        var h = l.match(/^(#{1,4})\s+(.*)$/);
        if (h) { out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
        if (/^\s*>\s?/.test(l)) {
          var q = []; while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(inline(lines[i].replace(/^\s*>\s?/, ''))); i++; }
          out.push('<blockquote>' + q.join('<br>') + '</blockquote>'); continue;
        }
        if (/^\s*[-*]\s+/.test(l)) {
          var items = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push('<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++; }
          out.push('<ul>' + items.join('') + '</ul>'); continue;
        }
        if (/^\s*\d+\.\s+/.test(l)) {
          var oi = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { oi.push('<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'); i++; }
          out.push('<ol>' + oi.join('') + '</ol>'); continue;
        }
        if (/^\s*$/.test(l)) { i++; continue; }
        var para = [l]; i++;
        while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4}\s|\s*[-*]\s|\s*\d+\.\s|>|```)/.test(lines[i])) { para.push(lines[i]); i++; }
        out.push('<p>' + inline(para.join(' ')) + '</p>');
      }
      return out.join('\n');
    }
    function renderPreview() { document.getElementById('preview').innerHTML = md(document.getElementById('editor').value); }

    document.getElementById('editor').addEventListener('input', scheduleSave);
    document.getElementById('title').addEventListener('input', scheduleSave);

    // init
    if (!db().length) newNote(); else { curId = db()[0].id; loadNote(); }
  </script>
</body>
</html>
