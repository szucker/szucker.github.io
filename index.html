<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Now · Command Center</title>
  <link rel="stylesheet" href="assets/css/tools.css" />
  <script src="assets/js/tools.js"></script>
  <style>
    .home { max-width: 600px; }
    .hello { margin: 12px 0 22px; }
    .hello .hi { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; cursor: text; }
    .hello .date { color: var(--text-faint); margin-top: 2px; }
    .now-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 18px;
      padding: 18px; box-shadow: var(--shadow); margin-bottom: 15px; }
    .now-card .lbl { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint);
      font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
    .reroll { cursor: pointer; font-size: 1rem; color: var(--text-soft); user-select: none; }
    .reroll:hover { color: var(--text); }
    .now-title { font-size: 1.28rem; font-weight: 700; line-height: 1.25; }
    .now-sub { color: var(--text-soft); font-size: .9rem; margin-top: 4px; }
    .now-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .now-actions .btn { padding: 12px 18px; font-size: .96rem; border-radius: 13px; }
    .now-actions .grow { flex: 1; justify-content: center; min-width: 110px; }
    .accent-card { border-left: 5px solid var(--accent); }
    .more-links { display: flex; gap: 8px 18px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
    .more-links a { color: var(--text-soft); font-size: .9rem; }
    .tiny { color: var(--text-faint); font-size: .82rem; }
  </style>
</head>
<body data-base="">
  <div class="wrap home">

    <div class="hello">
      <div class="hi" id="hi" title="Tap to set your name">Hi.</div>
      <div class="date" id="date"></div>
    </div>

    <!-- Next up -->
    <div class="now-card">
      <div class="lbl">Next up</div>
      <div id="next"></div>
    </div>

    <!-- Do one thing -->
    <div class="now-card accent-card">
      <div class="lbl">Do one thing <span class="reroll" onclick="rollOne()" title="Something else">↻</span></div>
      <div id="one"></div>
    </div>

    <!-- Reach out -->
    <div class="now-card" id="reach-card" style="display:none">
      <div class="lbl">Reach out <span class="reroll" onclick="rollReach()" title="Someone else">↻</span></div>
      <div id="reach"></div>
    </div>

    <div class="more-links">
      <a href="tools/calendar.html">📅 Calendar</a>
      <a href="tools/contacts.html">🤝 People</a>
      <a href="tools/library.html">📖 Library</a>
      <a href="tools/planner.html">🗓️ Planner</a>
      <a href="tools/reading.html">📚 Reading</a>
    </div>
    <p class="tiny" style="text-align:center;margin-top:26px">Private &amp; local to this browser. Everything else lives in the <b>⋯ More</b> menu above.</p>
  </div>

  <script>
    CC.buildTopbar('home');
    CC.ensurePlannerDefaults();

    function fmtT(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

    /* ---------- greeting ---------- */
    function greet() {
      var h = new Date().getHours();
      var part = h < 5 ? 'Still up' : h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';
      var name = CC.load('cc.name', '');
      document.getElementById('hi').textContent = part + (name ? ', ' + name : '') + '.';
      document.getElementById('date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    }
    document.getElementById('hi').onclick = function () {
      var n = prompt('Your name (blank to clear):', CC.load('cc.name', ''));
      if (n !== null) { CC.save('cc.name', n.trim()); greet(); }
    };

    /* ---------- next up ---------- */
    function nextEvent() {
      var now = new Date();
      for (var i = 0; i < 3; i++) {
        var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + i);
        var ev = CC.eventsOnDay(d);
        var upcoming = ev.timed.filter(function (e) { return e.end > now; }).sort(function (a, b) { return a.start - b.start; });
        if (upcoming.length) return upcoming[0];
      }
      return null;
    }
    function renderNext() {
      var host = document.getElementById('next');
      var hasCal = !!CC.load('cc.calendar.importedAt', 0);
      if (!hasCal) {
        host.innerHTML = '<div class="now-title" style="font-size:1.05rem">No calendar yet</div>' +
          '<div class="now-sub">Import your <a href="tools/calendar.html">.ics once</a> and your next event shows here.</div>';
        return;
      }
      var e = nextEvent();
      if (!e) { host.innerHTML = '<div class="now-title" style="font-size:1.1rem">Nothing scheduled 🎉</div>'; return; }
      var now = new Date();
      var mins = Math.round((e.start - now) / 60000);
      var rel = e.start <= now ? 'now' : mins < 60 ? 'in ' + mins + ' min' : mins < 1440 ? 'in ' + Math.round(mins / 60) + " h" : fmtDay(e.start);
      host.innerHTML = '<div class="now-title">' + CC.esc(e.summary || '(busy)') + '</div>' +
        '<div class="now-sub">' + fmtDay(e.start) + ' · ' + fmtT(e.start) + '–' + fmtT(e.end) +
        (e.location ? ' · ' + CC.esc(e.location.split('\n')[0]) : '') + ' · <b>' + rel + '</b></div>';
    }
    function fmtDay(d) {
      var t = new Date(); t.setHours(0, 0, 0, 0);
      var diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - t) / 86400000);
      return diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    /* ---------- do one thing ---------- */
    var curOne = null;
    function rollOne() {
      var list = CC.buildSuggestions(25).filter(function (c) { return c.type !== 'reach'; });
      var host = document.getElementById('one');
      if (!list.length) {
        host.innerHTML = '<div class="now-sub">Nothing queued. Save an article in <a href="tools/reading.html">Reading</a> or add habits in the <a href="tools/planner.html">Planner</a>.</div>';
        curOne = null; return;
      }
      curOne = list[0];
      CC.markSuggested(curOne.key);
      var c = curOne;
      var actions = '';
      if (c.link) actions += '<a class="btn primary grow" href="' + CC.esc(c.link) + '" target="_blank" rel="noopener" onclick="doneOne(1)">Read it →</a>';
      else actions += '<button class="btn primary grow" onclick="startOne()">Start</button>';
      actions += '<button class="btn grow" onclick="doneOne()">Done ✓</button>';
      actions += '<button class="btn ghost" onclick="rollOne()">Later</button>';
      host.innerHTML = '<div class="now-title">' + CC.esc(c.label) + '</div>' +
        '<div class="now-sub">' + (c.areaName ? CC.esc(c.areaName) + ' · ' : '') + '~' + c.mins + ' min</div>' +
        '<div class="now-actions">' + actions + '</div>';
    }
    function startOne() { if (!curOne) return; CC.save('cc.focus.task', curOne.label.replace(/^Read:\s*/, '')); location.href = 'tools/focus.html'; }
    function doneOne(fromLink) { if (curOne) CC.completeSuggestion(curOne); if (!fromLink) rollOne(); }

    /* ---------- reach out ---------- */
    var curReach = null, reachSkip = {};
    function chanQuick(c) {
      var chans = c.channels || [];
      var email = chans.find(function (x) { return x.type === 'Email' || /@/.test(x.value); });
      var phone = chans.find(function (x) { return x.type === 'Phone' || /^[+()\d\s-]{7,}$/.test(x.value); });
      if (phone) return { href: 'sms:' + phone.value.replace(/[^+\d]/g, ''), label: 'Text →' };
      if (email) return { href: 'mailto:' + email.value, label: 'Email →' };
      return null;
    }
    function rollReach() {
      var due = CC.contactsDue().filter(function (d) { return d.overdue && !reachSkip[d.c.id]; });
      var card = document.getElementById('reach-card');
      if (!due.length) { card.style.display = 'none'; curReach = null; return; }
      card.style.display = 'block';
      curReach = due[0].c;
      var d = due[0];
      var quick = chanQuick(curReach);
      var actions = '';
      if (quick) actions += '<a class="btn primary grow" href="' + CC.esc(quick.href) + '" onclick="loggedReach()">' + quick.label + '</a>';
      actions += '<button class="btn grow" onclick="loggedReach()">Logged ✓</button>';
      actions += '<button class="btn ghost" onclick="skipReach()">Skip</button>';
      document.getElementById('reach').innerHTML =
        '<div class="now-title">' + CC.esc(curReach.name) + '</div>' +
        '<div class="now-sub">' + (curReach.relationship ? CC.esc(curReach.relationship) + ' · ' : '') +
          (d.last ? d.since + ' days since you connected' : 'no contact logged yet') + '</div>' +
        '<div class="now-actions">' + actions + '</div>';
    }
    function loggedReach() {
      if (!curReach) return;
      var a = CC.load('cc.contacts', []);
      var p = a.find(function (x) { return x.id === curReach.id; });
      if (p) { p.interactions = p.interactions || []; p.interactions.push({ id: CC.uid(), date: CC.todayStr(), type: 'Note', note: 'Reached out' }); CC.save('cc.contacts', a); }
      rollReach();
    }
    function skipReach() { if (curReach) reachSkip[curReach.id] = true; rollReach(); }

    greet(); renderNext(); rollOne(); rollReach();
    setInterval(function () { greet(); renderNext(); }, 60000);
  </script>
</body>
</html>
